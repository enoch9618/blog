<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>证主圣经百科</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 700px; margin: 0 auto; padding: 0 15px 20px; line-height: 1.7; color: #333; }
        .hidden { display: none; }
        header { position: sticky; top: 0; background: #fff; padding: 15px 0 10px; border-bottom: 1px solid #eee; z-index: 100; }
        /* 搜索框容器 */
        .s-wrap { position: relative; display: flex; align-items: center; }
        input { width: 100%; padding: 12px 40px 12px 12px; border: 2px solid #ddd; border-radius: 8px; font-size: 16px; outline: none; box-sizing: border-box; }
        input:focus { border-color: #2c3e50; }
        /* 清除按钮 */
        .clear-btn { position: absolute; right: 12px; color: #ccc; cursor: pointer; font-size: 20px; user-select: none; }
        .clear-btn:hover { color: #666; }
        /* 列表 */
        .item { padding: 15px 0; border-bottom: 1px solid #eee; cursor: pointer; }
        h3 { margin: 0; color: #0056b3; font-size: 18px; }
        .sum { font-size: 14px; color: #666; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        mark { background: #ff0; color: #000; }
        /* 正文 */
        #content { font-size: 18px; padding-top: 10px; }
        a[href^="#b"] { color: #d35400; text-decoration: none; pointer-events: none; border-bottom: 1px dotted #ccc; }
        .btn { color: #666; cursor: pointer; display: inline-block; padding: 10px 0; font-size: 14px; }
    </style>
</head>
<body>

<header>
    <div class="s-wrap">
        <input type="text" id="q" placeholder="输入词条标题搜索..." oninput="doSearch(this.value)">
        <span class="clear-btn" id="cb" onclick="clearQ()">✕</span>
    </div>
    <div id="info" style="font-size:12px; color:gray; margin-top:5px">载入中...</div>
</header>

<div id="view-list">
    <div id="list"></div>
</div>

<div id="view-detail" class="hidden">
    <span class="btn" onclick="goBack()">← 返回列表</span>
    <div id="content"></div>
</div>

<script>
let db = [], kw = "";
const vL = document.getElementById('view-list'), vD = document.getElementById('view-detail'), 
      list = document.getElementById('list'), info = document.getElementById('info'), 
      cont = document.getElementById('content'), qIn = document.getElementById('q');

// 初始加载
fetch('encyclopedia.json').then(r => r.json()).then(data => {
    db = data.records;
    info.innerText = `共 ${db.length} 个词条`;
});

function clearQ() { qIn.value = ""; doSearch(""); qIn.focus(); }

function doSearch(val) {
    kw = val.trim().toLowerCase();
    vD.classList.add('hidden');
    vL.classList.remove('hidden');
    
    // 清除按钮显示/隐藏
    document.getElementById('cb').style.display = kw ? "block" : "none";

    if (!kw) { list.innerHTML = ""; info.innerText = `共 ${db.length} 个词条`; return; }

    // 1. 过滤与排序
    const allMatches = db.filter(i => i.title.toLowerCase().includes(kw))
        .sort((a, b) => {
            let ta = a.title.toLowerCase(), tb = b.title.toLowerCase();
            if (ta === kw) return -1;
            return ta.startsWith(kw) && !tb.startsWith(kw) ? -1 : ta.length - tb.length;
        });

    // 2. 显示实际匹配总数
    info.innerText = `找到 ${allMatches.length} 个相关词条`;

    // 3. 转义特殊字符并高亮 (限制显示前40条提高性能)
    const safeKw = kw.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); 
    const reg = new RegExp(`(${safeKw})`, 'gi');

    list.innerHTML = allMatches.slice(0, 40).map(i => `
        <div class="item" onclick="show(${i.id})">
            <h3>${i.title.replace(reg, '<mark>$1</mark>')}</h3>
            <div class="sum">${i.content.substring(0, 80)}...</div>
        </div>
    `).join('');
}

function show(id) {
    const it = db.find(x => x.id === id);
    vL.classList.add('hidden');
    vD.classList.remove('hidden');
    cont.innerHTML = `<h1>${it.title}</h1>` + it.content_html;
    window.scrollTo(0, 0);
}

function goBack() { vD.classList.add('hidden'); vL.classList.remove('hidden'); }
</script>

</body>
</html>
