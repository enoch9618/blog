<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>证主圣经百科</title>
    <style>
        :root { --p: #2c3e50; --a: #d35400; --b: #eee; --g: #666; }
        body { font-family: system-ui, -apple-system, sans-serif; max-width: 750px; margin: 0 auto; padding: 0 15px 30px; line-height: 1.8; color: #333; background: #fff; }
        .hidden { display: none !important; }
        /* 进度条样式 */
        #ld { position: fixed; inset: 0; background: #fff; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .p-b { width: 200px; height: 6px; background: #eee; border-radius: 3px; margin-top: 10px; overflow: hidden; }
        #p-f { width: 0; height: 100%; background: var(--p); transition: width 0.2s; }
        /* 顶部栏 */
        header { position: sticky; top: 0; background: #fff; padding: 15px 0 10px; border-bottom: 1px solid var(--b); z-index: 9; }
        .s-bar { position: relative; display: flex; align-items: center; }
        input { width: 100%; padding: 12px 40px 12px 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; outline: none; -webkit-appearance: none; }
        input:focus { border-color: var(--p); box-shadow: 0 0 0 3px rgba(44,62,80,0.1); }
        .cls-btn { position: absolute; right: 12px; color: #ccc; cursor: pointer; font-size: 20px; }
        #info { font-size: 12px; color: var(--g); margin: 6px 0 -4px; height: 1.2em; }
        /* 搜索列表 */
        .item { padding: 16px 0; border-bottom: 1px solid var(--b); cursor: pointer; }
        h3 { margin: 0; color: #0056b3; font-size: 18px; line-height: 1.4; }
        .sum { font-size: 14px; color: var(--g); margin-top: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        mark { background: #ff0; color: #000; padding: 0 1px; }
        /* 内容阅读 */
        #view-detail { animation: fadeIn 0.2s ease-out; }
        .back { color: var(--g); cursor: pointer; display: inline-block; padding: 12px 0; font-size: 14px; font-weight: 600; }
        #content h1 { border-left: 5px solid var(--p); padding-left: 12px; margin: 10px 0 25px; font-size: 26px; color: var(--p); }
        #content a { color: var(--a); text-decoration: none; border-bottom: 1px dotted var(--a); }
        /* 经文弹窗 */
        #modal-ov { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 99; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(2px); }
        #modal { background: #fff; width: 92%; max-width: 480px; border-radius: 12px; max-height: 80vh; display: flex; flex-direction: column; box-shadow: 0 10px 40px rgba(0,0,0,0.2); }
        .m-head { padding: 16px; border-bottom: 1px solid var(--b); display: flex; justify-content: space-between; font-weight: bold; }
        .m-body { padding: 20px; overflow-y: auto; font-size: 17px; }
        .v-group { margin-bottom: 25px; }
        .v-title { font-weight: bold; color: var(--p); border-left: 4px solid var(--a); padding-left: 10px; margin-bottom: 10px; }
        .v-num { color: var(--a); font-weight: bold; margin-right: 8px; font-size: 0.85em; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<!-- 加载遮罩 -->
<div id="ld">
    <div id="ld-t" style="font-size:14px; color:var(--p)">正在载入...</div>
    <div class="p-b"><div id="p-f"></div></div>
</div>

<header>
    <div class="s-bar">
        <input type="text" id="q" placeholder="输入词条标题搜索..." oninput="doSearch(this.value)" autocomplete="off">
        <span class="cls-btn hidden" id="cb" onclick="clearSearch()">✕</span>
    </div>
    <div id="info">正在初始化...</div>
</header>

<div id="view-list"><div id="list"></div></div>

<div id="view-detail" class="hidden">
    <span class="back" onclick="goBack()">← 返回列表</span>
    <div id="content"></div>
</div>

<div id="modal-ov" class="hidden" onclick="closeM()">
    <div id="modal" onclick="event.stopPropagation()">
        <div class="m-head"><span>经文引用</span><span style="cursor:pointer;font-size:24px" onclick="closeM()">×</span></div>
        <div id="m-body" class="m-body"></div>
    </div>
</div>

<script>
/** 书卷映射字典 (固定不变) **/
const F_MAP = {"创世记":"创","出埃及记":"出","利未记":"利","民数记":"民","申命记":"申","约书亚记":"书","士师记":"士","路得记":"得","撒母耳记上":"撒上","撒母耳记下":"撒下","列王纪上":"王上","列王纪下":"王下","历代志上":"代上","历代志下":"代下","以斯拉记":"拉","尼希米记":"尼","以斯帖记":"斯","约伯记":"伯","诗篇":"诗","箴言":"箴","传道书":"传","雅歌":"歌","以赛亚书":"赛","耶利米书":"耶","耶利米哀歌":"哀","以西结书":"结","但以理书":"但","何西阿书":"何","约珥书":"珥","阿摩司书":"摩","俄巴底亚书":"俄","约拿书":"拿","弥迦书":"弥","那鸿书":"鸿","哈巴谷书":"哈","西番雅书":"番","哈该书":"该","撒迦利亚书":"亚","玛拉基书":"玛","马太福音":"太","马可福音":"可","路加福音":"路","约翰福音":"约","使徒行传":"徒","罗马书":"罗","哥林多前书":"林前","哥林多后书":"林后","加拉太书":"加","以弗所书":"弗","腓立比书":"腓","歌罗西书":"西","帖撒罗尼迦前书":"帖前","帖撒罗尼迦后书":"帖后","提摩太前书":"提前","提摩太后书":"提后","提多书":"多","腓利门书":"门","希伯来书":"来","雅各书":"雅","彼得前书":"彼前","彼得后书":"彼后","约翰一书":"约一","约翰二书":"约二","约翰三书":"约三","犹大书":"犹","启示录":"启"};
const B_MAP = {"创":"创世记","出":"出埃及记","利":"利未记","民":"民数记","申":"申命记","书":"约书亚记","士":"士师记","得":"路得记","撒上":"撒母耳记上","撒下":"撒母耳记下","王上":"列王纪上","王下":"列王纪下","代上":"历代志上","代下":"历代志下","拉":"以斯拉记","尼":"尼希米记","斯":"以斯帖记","伯":"约伯记","诗":"诗篇","箴":"箴言","传":"传道书","歌":"雅歌","赛":"以赛亚书","耶":"耶利米书","哀":"耶利米哀歌","结":"以西结书","但":"但以理书","何":"何西阿书","珥":"约珥书","摩":"阿摩司书","俄":"俄巴底亚书","拿":"约拿书","弥":"弥迦书","鸿":"那鸿书","哈":"哈巴谷书","番":"西番雅书","该":"哈该书","亚":"撒迦利亚书","玛":"玛拉基书","太":"马太福音","可":"马可福音","路":"路加福音","约":"约翰福音","徒":"使徒行传","罗":"罗马书","林前":"哥林多前书","林后":"哥林多后书","加":"加拉太书","弗":"以弗所书","腓":"腓立比书","西":"歌罗西书","帖前":"帖撒罗尼迦前书","帖后":"帖撒罗尼迦后书","提前":"提摩太前书","提后":"提摩太后书","多":"提多书","门":"腓利门书","来":"希伯来书","雅":"雅各书","彼得前书":"彼前","彼得后书":"彼后","约翰一书":"约一","约翰二书":"约二","约翰三书":"约三","犹":"犹大书","启":"启示录"};
const TO_FILE = Object.assign({}, F_MAP, Object.fromEntries(Object.keys(B_MAP).map(k=>[k,k])));
const SORTED_NAMES = Object.keys(TO_FILE).sort((a,b)=>b.length - a.length);

let db = [], kw = "", cache = {};
const $ = (id) => document.getElementById(id);

/** IndexedDB 存储逻辑 **/
const DB_NAME = 'BibleDB', STORE_NAME = 'encyclopedia_store';

async function init() {
    const idb = await new Promise(res => {
        let req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = e => e.target.result.createObjectStore(STORE_NAME);
        req.onsuccess = e => res(e.target.result);
    });

    const cached = await new Promise(res => {
        idb.transaction(STORE_NAME).objectStore(STORE_NAME).get('records').onsuccess = e => res(e.target.result);
    });

    if (cached) {
        db = cached;
        onReady();
    } else {
        const xhr = new XMLHttpRequest();
        xhr.open('GET', 'encyclopedia.json', true);
        xhr.onprogress = (e) => {
            if (e.lengthComputable) {
                let p = Math.round((e.loaded / e.total) * 100);
                $('ld-t').innerText = `首次访问，正在下载百科数据: ${p}%`;
                $('p-f').style.width = p + '%';
            }
        };
        xhr.onload = () => {
            if (xhr.status === 200) {
                $('ld-t').innerText = "解析数据中...";
                setTimeout(() => {
                    db = JSON.parse(xhr.responseText).records;
                    idb.transaction(STORE_NAME, 'readwrite').objectStore(STORE_NAME).put(db, 'records');
                    onReady();
                }, 10);
            } else { $('ld-t').innerText = "下载失败"; }
        };
        xhr.send();
    }
}

function onReady() {
    $('ld').classList.add('hidden');
    $('info').innerText = `已载入 ${db.length} 个词条`;
}

/** 搜索逻辑 (极速版) **/
function doSearch(v) {
    kw = v.trim().toLowerCase();
    $('view-detail').classList.add('hidden');
    $('view-list').classList.remove('hidden');
    $('cb').classList.toggle('hidden', !kw);
    if(!kw) { $('list').innerHTML=""; $('info').innerText=`共 ${db.length} 个词条`; return; }
    
    // 匹配算法：完全匹配 > 开头匹配 > 包含匹配
    const res = db.filter(i=>i.title.toLowerCase().includes(kw)).sort((a,b)=>{
        let ta=a.title.toLowerCase(), tb=b.title.toLowerCase();
        return ta===kw ? -1 : ta.startsWith(kw)&&!tb.startsWith(kw) ? -1 : ta.length - tb.length;
    });
    $('info').innerText=`找到 ${res.length} 个结果`;
    const reg = new RegExp(`(${kw.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`,'gi');
    $('list').innerHTML = res.slice(0,40).map(i=>`
        <div class="item" onclick="showDet(${i.id})">
            <h3>${i.title.replace(reg,'<mark>$1</mark>')}</h3>
            <div class="sum">${i.content.substring(0,75)}...</div>
        </div>`).join('');
}

function showDet(id) {
    const it = db.find(x=>x.id===id);
    if(!it) return;
    $('view-list').classList.add('hidden');
    $('view-detail').classList.remove('hidden');
    $('content').innerHTML = `<h1>${it.title}</h1>${it.content_html}`;
    window.scrollTo(0,0);
}

// 统一点击事件委托
$('view-detail').onclick = (e) => {
    const a = e.target.closest('a');
    if (!a) return;
    const hash = a.hash, title = a.getAttribute('title') || a.innerText;
    if (hash==='#b') { e.preventDefault(); openB(title); }
    else if (hash==='#d') { 
        e.preventDefault();
        const clean = title.replace(/^[\s\u3000]+|[\s\u3000]+$/g, '');
        const target = db.find(x => x.title === title) || db.find(x => x.title === clean);
        target ? showDet(target.id) : alert('未找到词条: '+title);
    }
}

async function openB(raw) {
    const body = $('m-body');
    body.innerHTML = "载入中...";
    $('modal-ov').classList.remove('hidden');
    try {
        let clean = raw.replace(/[参见《》\s]/g,'').replace(/：/g,':').replace(/；/g,';').replace(/[，、]/g,',').replace(/[－—]/g,'-');
        let html = "";
        for (const ref of clean.split(';')) {
            let name = SORTED_NAMES.find(n=>ref.startsWith(n));
            if (!name) continue;
            let file = TO_FILE[name], rest = ref.substring(name.length).split(':');
            if (rest.length<2) continue;
            let cap = rest[0], vPart = rest[1];
            if (!cache[file]) {
                const r = await fetch(`/bible-data/${encodeURIComponent(file)}.json`);
                if (!r.ok) throw new Error(file);
                cache[file] = await r.json();
            }
            let cData = cache[file][cap];
            html += `<div class="v-group"><div class="v-title">${B_MAP[file]||file} ${cap}:${vPart}</div>`;
            if (!cData) { html += "未找到章节内容</div>"; continue; }
            vPart.split(',').forEach(p => {
                let r = p.split('-').map(Number);
                for (let i=r[0]; i<=(r[1]||r[0]); i++) {
                    if (cData[i-1]) html += `<div><span class="v-num">${i}</span>${cData[i-1]}</div>`;
                }
            });
            html += `</div>`;
        }
        body.innerHTML = html || "无法解析引用";
    } catch (e) { body.innerHTML = `<div style="color:red">加载失败: ${e.message}</div>`; }
}

function clearSearch() { $('q').value=""; doSearch(""); $('q').focus(); }
function goBack() { $('view-detail').classList.add('hidden'); $('view-list').classList.remove('hidden'); }
function closeM() { $('modal-ov').classList.add('hidden'); }
window.onkeydown = (e) => { if(e.key==="Escape") closeM(); };

init();
</script>
</body>
</html>
