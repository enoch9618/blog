<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>圣经阅读器</title>
    <style>
        :root { --bg: #f4f1ea; --text: #2d2621; --border: #d6cfbc; --accent: #8c6d46; --card: #fdfcf9; }
        @media (prefers-color-scheme: dark) {
            :root { --bg: #1a1a1b; --text: #d4d4d4; --border: #3e3e3e; --accent: #c9a96e; --card: #242424; }
        }
        body { background: var(--bg); color: var(--text); font-family: -apple-system, sans-serif; margin: 0; display: flex; justify-content: center; }
        #app { width: 100%; max-width: 800px; min-height: 100vh; padding: 20px; box-sizing: border-box; }
        .header { position: sticky; top: 0; background: var(--bg); padding: 10px 0; border-bottom: 1px solid var(--border); z-index: 10; }
        select { width: 100%; padding: 12px; font-size: 16px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); color: var(--text); }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(40px, 1fr)); gap: 6px; margin-top: 10px; max-height: 120px; overflow-y: auto; padding: 5px; }
        .btn { padding: 8px 0; text-align: center; border: 1px solid var(--border); border-radius: 4px; cursor: pointer; font-size: 14px; background: var(--card); }
        .btn.active { background: var(--accent); color: white; border-color: var(--accent); }
        .content { padding: 30px 0; }
        .verse { margin-bottom: 12px; line-height: 1.8; font-size: 1.1rem; display: flex; }
        .num { color: var(--accent); font-weight: bold; margin-right: 12px; min-width: 25px; text-align: right; font-family: monospace; }
        .nav-btns { display: flex; gap: 10px; margin: 20px 0 50px; }
        .nav-btns button { flex: 1; padding: 15px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); color: var(--text); cursor: pointer; font-weight: bold; }
        .error { color: #e53e3e; background: #fff5f5; padding: 20px; border-radius: 8px; border: 1px solid #feb2b2; text-align: center; }
    </style>
</head>
<body>
    <div id="app">
        <div id="loading" style="text-align: center; padding-top: 100px;">正在载入圣经数据...</div>
    </div>

<script>
const BIBLE_BOOKS = [
    { n:"创世记", f:"创", c:50 }, { n:"出埃及记", f:"出", c:40 }, { n:"利未记", f:"利", c:27 }, { n:"民数记", f:"民", c:36 }, { n:"申命记", f:"申", c:34 }, { n:"约书亚记", f:"书", c:24 }, { n:"士师记", f:"士", c:21 }, { n:"路得记", f:"得", c:4 }, { n:"撒母耳记上", f:"撒上", c:31 }, { n:"撒母耳记下", f:"撒下", c:24 }, { n:"列王纪上", f:"王上", c:22 }, { n:"列王纪下", f:"王下", c:25 }, { n:"历代志上", f:"代上", c:29 }, { n:"历代志下", f:"代下", c:36 }, { n:"以斯拉记", f:"斯", c:10 }, { n:"尼希米记", f:"尼", c:13 }, { n:"以斯帖记", f:"帖", c:10 }, { n:"约伯记", f:"伯", c:42 }, { n:"诗篇", f:"诗", c:150 }, { n:"箴言", f:"箴", c:31 }, { n:"传道书", f:"传", c:12 }, { n:"雅歌", f:"歌", c:8 }, { n:"以赛亚书", f:"赛", c:66 }, { n:"耶利米书", f:"耶", c:52 }, { n:"耶利米哀歌", f:"哀", c:5 }, { n:"以西结书", f:"结", c:48 }, { n:"但以理书", f:"但", c:12 }, { n:"何西阿书", f:"何", c:14 }, { n:"约珥书", f:"珥", c:3 }, { n:"阿摩司书", f:"摩", c:9 }, { n:"俄巴底亚书", f:"俄", c:1 }, { n:"约拿书", f:"拿", c:4 }, { n:"弥迦书", f:"弥", c:7 }, { n:"那鸿书", f:"鸿", c:3 }, { n:"哈巴谷书", f:"哈", c:3 }, { n:"西番雅书", f:"番", c:3 }, { n:"哈该书", f:"该", c:2 }, { n:"撒迦利亚书", f:"亚", c:14 }, { n:"玛拉基书", f:"玛", c:4 }, { n:"马太福音", f:"太", c:28 }, { n:"马可福音", f:"可", c:16 }, { n:"路加福音", f:"路", c:24 }, { n:"约翰福音", f:"约", c:21 }, { n:"使徒行传", f:"徒", c:28 }, { n:"罗马书", f:"罗", c:16 }, { n:"哥林多前书", f:"林前", c:16 }, { n:"哥林多后书", f:"林后", c:13 }, { n:"加拉太书", f:"加", c:6 }, { n:"以弗所书", f:"弗", c:6 }, { n:"腓立比书", f:"腓", c:4 }, { n:"歌罗西书", f:"西", c:4 }, { n:"帖撒罗尼迦前书", f:"帖前", c:5 }, { n:"帖撒罗尼迦后书", f:"帖后", c:3 }, { n:"提摩太前书", f:"提前", c:6 }, { n:"提摩太后书", f:"提后", c:4 }, { n:"提多书", f:"多", c:3 }, { n:"腓利门书", f:"门", c:1 }, { n:"希伯来书", f:"来", c:13 }, { n:"雅各书", f:"雅", c:5 }, { n:"彼得前书", f:"彼前", c:5 }, { n:"彼得后书", f:"彼后", c:3 }, { n:"约翰一书", f:"约一", c:5 }, { n:"约翰二书", f:"约二", c:1 }, { n:"约翰三书", f:"约三", c:1 }, { n:"犹大书", f:"犹", c:1 }, { n:"启示录", f:"启", c:22 }
];

let state = { book: BIBLE_BOOKS[0], chap: 1, data: null };

async function loadData() {
    // 因为访问的是 /bible.html，数据在 /bible-data/，所以用相对路径 ./bible-data/
    const url = `./bible-data/${state.book.f}.json`;
    try {
        const res = await fetch(url);
        if (!res.ok) throw new Error(`找不到文件: bible-data/${state.book.f}.json`);
        state.data = await res.json();
        render();
    } catch (e) {
        document.getElementById('app').innerHTML = `<div class="error"><h3>加载失败</h3><p>${e.message}</p></div>`;
    }
}

function render() {
    const verses = state.data[state.chap] || ["本章内容暂缺"];
    let chaps = "";
    for(let i=1; i<=state.book.c; i++) {
        chaps += `<div class="btn ${i===state.chap?'active':''}" onclick="setChap(${i})">${i}</div>`;
    }

    document.getElementById('app').innerHTML = `
        <div class="header">
            <select onchange="setBook(this.value)">
                ${BIBLE_BOOKS.map(b => `<option value="${b.f}" ${b.f===state.book.f?'selected':''}>${b.n}</option>`).join('')}
            </select>
            <div class="grid">${chaps}</div>
        </div>
        <div class="content">
            <h1 style="text-align:center">${state.book.n}</h1>
            <p style="text-align:center; opacity:0.6">第 ${state.chap} 章</p>
            <hr style="border:0; border-top:1px solid var(--border); margin:20px 0;">
            ${verses.map((v, i) => `<div class="verse"><span class="num">${i+1}</span><span>${v}</span></div>`).join('')}
        </div>
        <div class="nav-btns">
            <button onclick="prev()">上一章</button>
            <button onclick="next()">下一章</button>
        </div>
    `;
    window.scrollTo(0,0);
}

window.setBook = (f) => { state.book = BIBLE_BOOKS.find(b=>b.f===f); state.chap = 1; loadData(); };
window.setChap = (c) => { state.chap = c; render(); };
window.prev = () => { if(state.chap > 1) setChap(state.chap-1); else setBook(BIBLE_BOOKS[BIBLE_BOOKS.findIndex(b=>b.f===state.book.f)-1]?.f || "启"); };
window.next = () => { if(state.chap < state.book.c) setChap(state.chap+1); else setBook(BIBLE_BOOKS[BIBLE_BOOKS.findIndex(b=>b.f===state.book.f)+1]?.f || "创"); };

// 初始化，默认显示哀歌（如果你只有这个数据）
state.book = BIBLE_BOOKS.find(b => b.f === "哀") || BIBLE_BOOKS[0];
loadData();
</script>
</body>
</html>
