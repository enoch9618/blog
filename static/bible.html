<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root { --bg: #fdfaf2; --txt: #3e3530; --accent: #a68b5b; --sub: #e8e2d6; }
        body { margin: 0; font: clamp(1.1rem, 4.5vw, 1.25rem)/1.8 "PingFang SC", system-ui; background: var(--bg); color: var(--txt); }
        
        /* 顶部导航：暖色半透明 */
        #h { position: sticky; top: 0; background: rgba(253, 250, 242, 0.95); backdrop-filter: blur(8px); padding: 12px 15px 5px; border-bottom: 1px solid var(--sub); z-index: 9; }
        select { width: 100%; border: 1px solid var(--sub); background: #fff; padding: 10px; border-radius: 8px; font-size: 1rem; color: var(--txt); outline: none; -webkit-appearance: none; }
        
        /* 章节导航：极简横滑 */
        #g { display: flex; overflow-x: auto; padding: 15px 0; gap: 20px; scrollbar-width: none; }
        #g::-webkit-scrollbar { display: none; }
        .ch { cursor: pointer; color: var(--txt); opacity: 0.4; font-weight: 500; flex-shrink: 0; transition: 0.3s; }
        .ch.a { color: var(--accent); opacity: 1; transform: scale(1.2); border-bottom: 2px solid var(--accent); }
        
        /* 内容区：人文排版 */
        #v { max-width: 650px; margin: auto; padding: 20px 25px 120px; min-height: 80vh; }
        h1 { font-size: 1.6rem; margin: 0 0 10px; color: var(--accent); font-weight: normal; }
        .t { position: relative; padding-left: 2.2rem; margin-bottom: 1.2rem; text-align: justify; }
        .n { position: absolute; left: 0; color: var(--accent); font-size: 0.85rem; font-family: Constantia, serif; font-weight: bold; opacity: 0.6; top: 2px; }
        
        /* 底部操作：轻量化设计 */
        .f { position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%); display: flex; gap: 15px; width: 85%; max-width: 400px; }
        button { flex: 1; padding: 14px; border: none; border-radius: 50px; background: var(--txt); color: var(--bg); font-weight: bold; cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.1); opacity: 0.9; }
        button:active { transform: scale(0.95); opacity: 1; }
    </style>
</head>
<body>
    <div id="h">
        <select id="s" onchange="go(this.value,1)"></select>
        <div id="g"></div>
    </div>
    <div id="v"></div>
    <div class="f"><button onclick="nav(-1)">上一章</button><button onclick="nav(1)">下一章</button></div>

<script>
const B = "创世记,创,50|出埃及记,出,40|利未记,利,27|民数记,民,36|申命记,申,34|约书亚记,书,24|士师记,士,21|路得记,得,4|撒母耳记上,撒上,31|撒母耳记下,撒下,24|列王纪上,王上,22|列王纪下,王下,25|历代志上,代上,29|历代志下,代下,36|以斯拉记,斯,10|尼希米记,尼,13|以斯帖记,帖,10|约伯记,伯,42|诗篇,诗,150|箴言,箴,31|传道书,传,12|雅歌,歌,8|以赛亚书,赛,66|耶利米书,耶,52|耶利米哀歌,哀,5|以西结书,结,48|但以理书,但,12|何西阿书,何,14|约珥书,珥,3|阿摩司书,摩,9|俄巴底亚书,俄,1|约拿书,拿,4|弥迦书,弥,7|那鸿书,鸿,3|哈巴谷书,哈,3|西番雅书,番,3|哈该书,该,2|撒迦利亚书,亚,14|玛拉基书,玛,4|马太福音,太,28|马可福音,可,16|路加福音,路,24|约翰福音,约,21|使徒行传,徒,28|罗马书,罗,16|哥林多前书,林前,16|哥林多后书,林后,13|加拉太书,加,6|以弗所书,弗,6|腓立比书,腓,4|歌罗西书,西,4|帖撒罗尼迦前书,帖前,5|帖撒罗尼迦后书,帖后,3|提摩太前书,提前,6|提摩太后书,提后,4|提多书,多,3|腓利门书,门,1|希伯来书,来,13|雅各书,雅,5|彼得前书,彼前,5|彼得后书,彼后,3|约翰一书,约一,5|约翰二书,约二,1|约翰三书,约三,1|犹大书,犹,1|启示录,启,22".split('|').map(v=>v.split(','));

let bk = localStorage.bk||0, ch = localStorage.ch||1, data={};

// 初始化下拉菜单
s.innerHTML = B.map((v,i)=>`<option value=${i} ${i==bk?'selected':''}>${v[0]}</option>`).join('');

async function go(bi, ci) {
    bk = bi; ch = ci;
    localStorage.bk = bk; localStorage.ch = ch;

    // 更新滚动章节
    g.innerHTML = Array.from({length:B[bk][2]}, (_,i)=>`<span class="ch ${i+1==ch?'a':''}" onclick="go(${bk},${i+1})">${i+1}</span>`).join('');
    const act = g.querySelector('.a'); if(act) act.scrollIntoView({inline:'center', behavior:'smooth'});

    // 缓存加载逻辑
    const k = B[bk][1];
    if (!data[k]) {
        const local = localStorage.getItem(k);
        if (local) data[k] = JSON.parse(local);
        else {
            v.innerHTML = "载入中...";
            data[k] = await fetch(`./bible-data/${k}.json`).then(r=>r.json());
            localStorage.setItem(k, JSON.stringify(data[k]));
        }
    }
    
    // 内容渲染
    v.innerHTML = `<h1>${B[bk][0]}</h1><div style="opacity:0.4;margin-bottom:20px;font-size:0.9rem">CHAPTER ${ch}</div>` + 
        (data[k][ch]||[]).map((t,i)=>`<div class="t"><span class="n">${i+1}</span>${t}</div>`).join('');
    
    window.scrollTo({top:0, behavior:'instant'});
}

function nav(d) {
    let n = parseInt(ch) + d;
    if (n < 1) bk > 0 ? go(bk-1, B[bk-1][2]) : 0;
    else if (n > B[bk][2]) bk < 65 ? go(parseInt(bk)+1, 1) : 0;
    else go(bk, n);
}

// 首次运行
go(bk, ch);
</script>
</body>
</html>
