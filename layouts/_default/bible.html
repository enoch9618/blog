<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover">
    <title>圣经阅读器</title>
    <style>
        :root {
            --bg: #f4f1ea;
            --text: #2d2621;
            --border: #d6cfbc;
            --accent: #8c6d46;
            --card: #fdfcf9;
            --btn: #fdfcf9;
            --hl: #e9d8a6;
        }
        .dark {
            --bg: #1a1a1a;
            --text: #d4d4d4;
            --border: #3a3a3a;
            --accent: #c9a96e;
            --card: #242424;
            --btn: #2a2a2a;
            --hl: #5a4a1a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Serif SC", serif;
            background: var(--bg); color: var(--text); min-height: 100vh;
            transition: background 0.3s, color 0.3s;
        }

        /* 面包屑 */
        .breadcrumb {
            display: flex; gap: 6px; padding: 12px 16px;
            font-size: 13px; color: var(--accent); flex-wrap: wrap;
            position: sticky; top: 0; background: var(--bg); z-index: 50;
            border-bottom: 1px solid var(--border);
        }
        .breadcrumb span { opacity: 0.7; }
        .breadcrumb .current { opacity: 1; font-weight: bold; }

        /* 工具栏 */
        .toolbar {
            display: flex; gap: 10px; padding: 12px 16px;
            align-items: center; justify-content: flex-end;
            border-bottom: 1px solid var(--border);
            position: sticky; top: 41px; background: var(--bg); z-index: 49;
        }
        .toolbar button {
            padding: 6px 14px; border-radius: 6px; border: 1px solid var(--border);
            background: var(--btn); color: var(--text); cursor: pointer;
            font-size: 13px; transition: all 0.2s;
        }
        .toolbar button.active { background: var(--accent); color: #fff; border-color: var(--accent); }

        /* 导航区 */
        .nav-area {
            padding: 16px; max-width: 800px; margin: 0 auto;
        }
        .nav-row {
            display: flex; gap: 10px; margin-bottom: 12px; align-items: center;
        }
        .nav-row select {
            flex: 1; padding: 10px 12px; border-radius: 8px;
            border: 1.5px solid var(--border); background: var(--btn);
            color: var(--text); font-size: 15px; outline: none;
            font-weight: 600; cursor: pointer;
        }
        .chap-grid {
            display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px;
        }
        .chap-btn {
            padding: 10px 4px; border-radius: 6px; border: 1px solid var(--border);
            background: var(--btn); color: var(--text); cursor: pointer;
            font-size: 14px; font-weight: 600; text-align: center; transition: all 0.15s;
        }
        .chap-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
        .chap-btn:hover:not(.active) { border-color: var(--accent); }

        /* 经文区 */
        .verse-area { max-width: 800px; margin: 0 auto; padding: 0 16px; }
        .chapter-title {
            text-align: center; padding: 30px 0 10px;
            font-size: 26px; font-weight: 700; letter-spacing: 2px;
        }
        .chapter-subtitle {
            text-align: center; font-size: 13px; color: var(--accent);
            letter-spacing: 4px; margin-bottom: 24px;
        }
        .verse-line {
            padding: 8px 10px; border-radius: 6px; cursor: pointer;
            line-height: 1.9; border: 1px solid transparent; transition: background 0.15s;
        }
        .verse-line:hover { background: var(--card); border-color: var(--border); }
        .verse-num {
            color: var(--accent); font-weight: 800; margin-right: 6px;
            font-size: 0.8em; font-family: monospace; opacity: 0.8;
        }

        /* 段落模式 */
        .verse-area.para .verse-line { 
            display: inline; padding: 0; border: none; cursor: pointer; 
        }
        .verse-area.para .verse-line:hover { background: none; }
        .verse-area.para .verse-num { margin-right: 2px; }

        /* 底部翻章 */
        .nav-bottom {
            display: flex; gap: 12px; padding: 30px 16px 100px;
            max-width: 800px; margin: 0 auto;
        }
        .nav-bottom button {
            flex: 1; padding: 14px; border-radius: 10px; border: 1px solid var(--border);
            background: var(--btn); color: var(--text); cursor: pointer;
            font-size: 16px; font-weight: 600; transition: all 0.2s;
        }
        .nav-bottom button:hover { border-color: var(--accent); color: var(--accent); }

        /* Toast */
        .toast {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.85); color: #fff; padding: 10px 24px;
            border-radius: 20px; font-size: 14px; z-index: 9999;
            pointer-events: none; animation: fadeInOut 1.5s ease;
        }
        @keyframes fadeInOut {
            0% { opacity: 0; top: 40px; }
            20% { opacity: 1; top: 20px; }
            80% { opacity: 1; top: 20px; }
            100% { opacity: 0; top: 0; }
        }

        /* 移动端 */
        @media (max-width: 768px) {
            .chap-grid { grid-template-columns: repeat(5, 1fr); }
            .chapter-title { font-size: 22px; }
            .mobile-nav {
                position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
                width: 94%; height: 52px; background: var(--card); border: 1px solid var(--border);
                border-radius: 26px; display: flex; align-items: center;
                justify-content: space-between; padding: 0 8px; z-index: 100;
                box-shadow: 0 4px 20px rgba(0,0,0,0.25);
            }
            .mobile-nav button {
                background: none; border: none; font-size: 24px;
                color: var(--accent); padding: 8px 14px; cursor: pointer;
            }
            .mobile-nav .center-btn {
                font-weight: bold; font-size: 14px; color: var(--text); cursor: pointer;
                user-select: none;
            }
        }
        @media (min-width: 769px) {
            .mobile-nav { display: none; }
        }

        /* 面板遮罩 */
        .panel-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px); z-index: 200;
            display: flex; align-items: flex-end;
        }
        .panel {
            width: 100%; background: var(--bg); border-radius: 20px 20px 0 0;
            padding: 20px; max-height: 85vh; overflow-y: auto;
        }
        .panel-handle {
            width: 40px; height: 5px; background: var(--border);
            border-radius: 3px; margin: 0 auto 20px;
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <script>
    (function() {
        const BIBLE = [
            { n:"创世记", f:"创", c:50, t:"旧约" },{ n:"出埃及记", f:"出", c:40, t:"旧约" },
            { n:"利未记", f:"利", c:27, t:"旧约" },{ n:"民数记", f:"民", c:36, t:"旧约" },
            { n:"申命记", f:"申", c:34, t:"旧约" },{ n:"约书亚记", f:"书", c:24, t:"旧约" },
            { n:"士师记", f:"士", c:21, t:"旧约" },{ n:"路得记", f:"得", c:4, t:"旧约" },
            { n:"撒母耳记上", f:"撒上", c:31, t:"旧约" },{ n:"撒母耳记下", f:"撒下", c:24, t:"旧约" },
            { n:"列王纪上", f:"王上", c:22, t:"旧约" },{ n:"列王纪下", f:"王下", c:25, t:"旧约" },
            { n:"历代志上", f:"代上", c:29, t:"旧约" },{ n:"历代志下", f:"代下", c:36, t:"旧约" },
            { n:"以斯拉记", f:"斯", c:10, t:"旧约" },{ n:"尼希米记", f:"尼", c:13, t:"旧约" },
            { n:"以斯帖记", f:"帖", c:10, t:"旧约" },{ n:"约伯记", f:"伯", c:42, t:"旧约" },
            { n:"诗篇", f:"诗", c:150, t:"旧约" },{ n:"箴言", f:"箴", c:31, t:"旧约" },
            { n:"传道书", f:"传", c:12, t:"旧约" },{ n:"雅歌", f:"歌", c:8, t:"旧约" },
            { n:"以赛亚书", f:"赛", c:66, t:"旧约" },{ n:"耶利米书", f:"耶", c:52, t:"旧约" },
            { n:"耶利米哀歌", f:"哀", c:5, t:"旧约" },{ n:"以西结书", f:"结", c:48, t:"旧约" },
            { n:"但以理书", f:"但", c:12, t:"旧约" },{ n:"何西阿书", f:"何", c:14, t:"旧约" },
            { n:"约珥书", f:"珥", c:3, t:"旧约" },{ n:"阿摩司书", f:"摩", c:9, t:"旧约" },
            { n:"俄巴底亚书", f:"俄", c:1, t:"旧约" },{ n:"约拿书", f:"拿", c:4, t:"旧约" },
            { n:"弥迦书", f:"弥", c:7, t:"旧约" },{ n:"那鸿书", f:"鸿", c:3, t:"旧约" },
            { n:"哈巴谷书", f:"哈", c:3, t:"旧约" },{ n:"西番雅书", f:"番", c:3, t:"旧约" },
            { n:"哈该书", f:"该", c:2, t:"旧约" },{ n:"撒迦利亚书", f:"亚", c:14, t:"旧约" },
            { n:"玛拉基书", f:"玛", c:4, t:"旧约" },
            { n:"马太福音", f:"太", c:28, t:"新约" },{ n:"马可福音", f:"可", c:16, t:"新约" },
            { n:"路加福音", f:"路", c:24, t:"新约" },{ n:"约翰福音", f:"约", c:21, t:"新约" },
            { n:"使徒行传", f:"徒", c:28, t:"新约" },{ n:"罗马书", f:"罗", c:16, t:"新约" },
            { n:"哥林多前书", f:"林前", c:16, t:"新约" },{ n:"哥林多后书", f:"林后", c:13, t:"新约" },
            { n:"加拉太书", f:"加", c:6, t:"新约" },{ n:"以弗所书", f:"弗", c:6, t:"新约" },
            { n:"腓立比书", f:"腓", c:4, t:"新约" },{ n:"歌罗西书", f:"西", c:4, t:"新约" },
            { n:"帖撒罗尼迦前书", f:"帖前", c:5, t:"新约" },{ n:"帖撒罗尼迦后书", f:"帖后", c:3, t:"新约" },
            { n:"提摩太前书", f:"提前", c:6, t:"新约" },{ n:"提摩太后书", f:"提后", c:4, t:"新约" },
            { n:"提多书", f:"多", c:3, t:"新约" },{ n:"腓利门书", f:"门", c:1, t:"新约" },
            { n:"希伯来书", f:"来", c:13, t:"新约" },{ n:"雅各书", f:"雅", c:5, t:"新约" },
            { n:"彼得前书", f:"彼前", c:5, t:"新约" },{ n:"彼得后书", f:"彼后", c:3, t:"新约" },
            { n:"约翰一书", f:"约一", c:5, t:"新约" },{ n:"约翰二书", f:"约二", c:1, t:"新约" },
            { n:"约翰三书", f:"约三", c:1, t:"新约" },{ n:"犹大书", f:"犹", c:1, t:"新约" },
            { n:"启示录", f:"启", c:22, t:"新约" }
        ];

        let book = BIBLE[0], chap = 1, verses = [], paraMode = false, darkMode = false;
        let panelOpen = false, cache = {};

        const $ = s => document.querySelector(s);
        const app = $('#app');

        function toast(msg) {
            const t = document.createElement('div');
            t.className = 'toast'; t.textContent = msg;
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 1500);
        }

        async function load() {
            const key = book.f;
            if (!cache[key]) {
                const r = await fetch(`/bible-data/${key}.json`);
                cache[key] = await r.json();
            }
            verses = cache[key][String(chap)] || [];
            render();
            window.scrollTo({ top: 0, behavior: 'instant' });
        }

        function render() {
            const cls = darkMode ? 'dark' : '';
            const pcls = paraMode ? ' para' : '';

            let h = '';
            // 面包屑
            h += `<div class="breadcrumb ${cls}"><span>${book.t}</span><span>›</span><span class="current">${book.n}</span><span>›</span><span class="current">第${chap}章</span></div>`;

            // 工具栏
            h += `<div class="toolbar ${cls}">
                <button onclick="B.goPara()" class="${paraMode?'active':''}">📖 段落</button>
                <button onclick="B.goTheme()">${darkMode?'☀️ 纸张':'🌙 暗黑'}</button>
            </div>`;

            // 导航
            const ot = BIBLE.filter(b=>b.t==='旧约'), nt = BIBLE.filter(b=>b.t==='新约');
            h += `<div class="nav-area">`;
            h += `<div class="nav-row">
                <select onchange="B.pickBook(this.value)">`;
            h += `<optgroup label="旧约">${ot.map(b=>`<option value="${b.f}" ${b.f===book.f?'selected':''}>${b.n}</option>`).join('')}</optgroup>`;
            h += `<optgroup label="新约">${nt.map(b=>`<option value="${b.f}" ${b.f===book.f?'selected':''}>${b.n}</option>`).join('')}</optgroup>`;
            h += `</select></div>`;
            h += `<div class="chap-grid">`;
            for (let i=1; i<=book.c; i++) {
                h += `<button class="chap-btn ${i===chap?'active':''}" onclick="B.pickChap(${i})">${i}</button>`;
            }
            h += `</div></div>`;

            // 经文
            h += `<div class="verse-area${pcls}">`;
            h += `<div class="chapter-title">${book.n}</div>`;
            h += `<div class="chapter-subtitle">第 ${chap} 章</div>`;
            verses.forEach((v,i) => {
                h += `<div class="verse-line" onclick="B.copy(${i+1})"><sup class="verse-num">${i+1}</sup>${esc(v)}</div>`;
            });
            h += `</div>`;

            // 底部翻章
            h += `<div class="nav-bottom">
                <button onclick="B.prev()">← 上一章</button>
                <button onclick="B.next()">下一章 →</button>
            </div>`;

            // 移动端导航
            h += `<div class="mobile-nav">
                <button onclick="B.prev()">‹</button>
                <span class="center-btn" onclick="B.openPanel()">${book.f} · ${chap} ▾</span>
                <button onclick="B.next()">›</button>
            </div>`;

            // 移动端面板
            if (panelOpen) {
                h += `<div class="panel-overlay" onclick="B.closePanel()">
                    <div class="panel" onclick="event.stopPropagation()">
                        <div class="panel-handle"></div>
                        <div class="nav-row">
                            <select onchange="B.pickBook(this.value);B.closePanel();">`;
                h += `<optgroup label="旧约">${ot.map(b=>`<option value="${b.f}" ${b.f===book.f?'selected':''}>${b.n}</option>`).join('')}</optgroup>`;
                h += `<optgroup label="新约">${nt.map(b=>`<option value="${b.f}" ${b.f===book.f?'selected':''}>${b.n}</option>`).join('')}</optgroup>`;
                h += `</select></div>`;
                h += `<div class="chap-grid">`;
                for (let i=1; i<=book.c; i++) {
                    h += `<button class="chap-btn ${i===chap?'active':''}" onclick="B.pickChap(${i});B.closePanel();">${i}</button>`;
                }
                h += `</div></div></div>`;
            }

            app.innerHTML = h;
            document.body.className = cls;
            document.title = `${book.n} ${chap} - 圣经`;
        }

        function esc(s) {
            const d = document.createElement('div');
            d.textContent = s;
            return d.innerHTML;
        }

        // 暴露方法
        window.B = {
            pickBook(f) {
                const b = BIBLE.find(x=>x.f===f);
                if (b) { book = b; chap = 1; load(); }
            },
            pickChap(n) {
                chap = n; load();
            },
            prev() {
                if (chap > 1) chap--;
                else {
                    const i = BIBLE.findIndex(b=>b.f===book.f);
                    if (i > 0) { book = BIBLE[i-1]; chap = book.c; }
                }
                load();
            },
            next() {
                if (chap < book.c) chap++;
                else {
                    const i = BIBLE.findIndex(b=>b.f===book.f);
                    if (i < BIBLE.length-1) { book = BIBLE[i+1]; chap = 1; }
                }
                load();
            },
            copy(i) {
                const t = `${book.n} ${chap}:${i} ${verses[i-1]}`;
                navigator.clipboard.writeText(t).then(() => toast('已复制')).catch(() => {});
            },
            goPara() { paraMode = !paraMode; render(); },
            goTheme() { darkMode = !darkMode; render(); },
            openPanel() { panelOpen = true; render(); },
            closePanel() { panelOpen = false; render(); },
        };

        load();
    })();
    </script>
</body>
</html>
