baseURL = "https://blog-eyt.pages.dev/"
title = "Enoch"
theme = "PaperMod"

defaultContentLanguage = "zh"
languageCode = "zh-cn"
hasCJKLanguage = true

[pagination]
pagerSize = 10

enableRobotsTXT = true
enableEmoji = true

[params]
  author = ["Enoch"]
  description = "这是我的个人博客"
  env = "production"
  DateFormat = "2006-01-02"

  defaultTheme = "auto"
  disableThemeToggle = false

  # 显示控制
  ShowReadingTime = false
  ShowWordCount = false
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowRssButtonInSectionTermList = true
  ShowToc = true
  TocOpen = true                # 目录默认展开
  hideSummary = true            # 列表不显示摘要
  disableSpecial1stPost = true  # 去掉第一篇大卡片
  hidemeta = false

  # 首页 Profile 模式
  [params.profileMode]
    enabled = true
    title = "Enoch"
    subtitle = "我的泉源都在你里面"
    imageUrl = "/images/avatar.jpg"
    imageWidth = 120
    imageHeight = 120

# 导航菜单
[[menu.main]]
  name = "文章"
  url = "/posts/"
  weight = 1

[[menu.main]]
  name = "关于"
  url = "/about/"
  weight = 2

[[menu.main]]
  name = "查经资料"
  url = "/study/"
  weight = 3

pygmentsUseClasses = true

[markup]
  [markup.highlight]
    noClasses = false
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true