document.addEventListener("DOMContentLoaded", function() {
    const tocLinks = document.querySelectorAll('.toc a');
    const tocItems = document.querySelectorAll('.toc li');
    if (tocLinks.length === 0) return;

    
    const headings = Array.from(tocLinks).map(link => {
        const id = decodeURIComponent(link.getAttribute('href').substring(1));
        return document.getElementById(id);
    }).filter(Boolean);

    
    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                const id = entry.target.id;
                
                
                tocLinks.forEach(link => link.classList.remove('active'));
                tocItems.forEach(li => li.classList.remove('has-active'));

                
                const activeLink = document.querySelector(`.toc a[href="#${encodeURIComponent(id)}"]`);
                if (activeLink) {
                    activeLink.classList.add('active');
                    
                    
                    let currentLi = activeLink.closest('li');
                    while (currentLi) {
                        
                        currentLi.classList.add('has-active');
                        
                        
                        const parentUl = currentLi.parentElement;
                        currentLi = parentUl ? parentUl.closest('li') : null;
                    }
                }
            }
        });
    }, {
        rootMargin: "0px 0px -50% 0px", 
        threshold: 0
    });

    headings.forEach(heading => observer.observe(heading));
});
</script>

<script>

    document.querySelectorAll('a[href^="#"]').forEach(anchor => {

            e.preventDefault();
            var id = this.getAttribute("href").substr(1);
            if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                document.querySelector(`[id='${decodeURIComponent(id)}']`).scrollIntoView({
                    behavior: "smooth"
                });
            } else {
                document.querySelector(`[id='${decodeURIComponent(id)}']`).scrollIntoView();
            }
            if (id === "top") {
                history.replaceState(null, null, " ");
            } else {
                history.pushState(null, null, `#${id}`);
            }
        });
    });

</script>
<script>

            toplink.classList.remove("hidden");
        } else {
