<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>圣经阅读</title>
    <style>
        :root { --bg: #f4f1ea; --text: #2d2621; --border: #d6cfbc; --accent: #8c6d46; --card: #fdfcf9; }
        @media (prefers-color-scheme: dark) { :root { --bg: #1a1a1b; --text: #d4d4d4; --border: #3e3e3e; --accent: #c9a96e; --card: #242424; } }
        body { background: var(--bg); color: var(--text); font-family: serif; margin: 0; display: flex; justify-content: center; line-height: 1.8; }
        #app { width: 100%; max-width: 800px; padding: 0 20px; }
        #h { position: sticky; top: 0; background: var(--bg); padding: 10px 0; border-bottom: 1px solid var(--border); z-index: 9; display: flex; gap: 8px; }
        select { flex: 1; padding: 10px; font-size: 16px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); color: var(--text); outline: 0; }
        #v { padding: 20px 0; }
        h1 { font-size: 1.8rem; text-align: center; margin: 10px 0 0; }
        .ch-info { text-align: center; opacity: 0.5; }
        .line { margin-bottom: 16px; display: flex; font-size: 1.15rem; }
        .num { color: var(--accent); font-weight: bold; margin-right: 15px; min-width: 25px; text-align: right; font-size: 0.9em; margin-top: 4px; opacity: 0.7; }
        .nav { display: flex; gap: 12px; margin: 30px 0 60px; }
        .nav button { flex: 1; padding: 16px; border-radius: 12px; border: 0; background: var(--accent); color: #fff; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div id="app">
        <div id="h"><select id="sel" onchange="go(this.value, 1)"></select><select id="chapSel" onchange="go(sel.value, this.value)"></select></div>
        <div id="v"></div>
        <div class="nav"><button onclick="nav(-1)">上一章</button><button onclick="nav(1)">下一章</button></div>
    </div>
<script>
const B = "创世记,创,50|出埃及记,出,40|利未记,利,27|民数记,民,36|申命记,申,34|约书亚记,书,24|士师记,士,21|路得记,得,4|撒母耳记上,撒上,31|撒母耳记下,撒下,24|列王纪上,王上,22|列王纪下,王下,25|历代志上,代上,29|历代志下,代下,36|以斯拉记,斯,10|尼希米记,尼,13|以斯帖记,帖,10|约伯记,伯,42|诗篇,诗,150|箴言,箴,31|传道书,传,12|雅歌,歌,8|以赛亚书,赛,66|耶利米书,耶,52|耶利米哀歌,哀,5|以西结书,结,48|但以理书,但,12|何西阿书,何,14|约珥书,珥,3|阿摩司书,摩,9|俄巴底亚书,俄,1|约拿书,拿,4|弥迦书,弥,7|那鸿书,鸿,3|哈巴谷书,哈,3|西番雅书,番,3|哈该书,该,2|撒迦利亚书,亚,14|玛拉基书,玛,4|马太福音,太,28|马可福音,可,16|路加福音,路,24|约翰福音,约,21|使徒行传,徒,28|罗马书,罗,16|哥林多前书,林前,16|哥林多后书,林后,13|加拉太书,加,6|以弗所书,弗,6|腓立比书,腓,4|歌罗西书,西,4|帖撒罗尼迦前书,帖前,5|帖撒罗尼迦后书,帖后,3|提摩太前书,提前,6|提摩太后书,提后,4|提多书,多,3|腓利门书,门,1|希伯来书,来,13|雅各书,雅,5|彼得前书,彼前,5|彼得后书,彼后,3|约翰一书,约一,5|约翰二书,约二,1|约翰三书,约三,1|犹大书,犹,1|启示录,启,22".split('|').map(x=>x.split(','));
let bk = +localStorage.bk || 0, ch = +localStorage.ch || 1, cache = {};
sel.innerHTML = B.map((x,i)=>`<option value=${i} ${i==bk?'selected':''}>${x[0]}</option>`).join('');

async function go(bi, ci) {
    bk = +bi; ch = +ci; localStorage.setItem('bk', bk); localStorage.setItem('ch', ch);
    sel.value = bk;
    chapSel.innerHTML = Array.from({length:B[bk][2]}, (_,i)=>`<option value=${i+1} ${i+1==ch?'selected':''}>第 ${i+1} 章</option>`).join('');
    let k = B[bk][1];
    if (!cache[k]) {
        cache[k] = JSON.parse(localStorage.getItem(k)) || await fetch(`./bible-data/${k}.json`).then(r=>r.json());
        localStorage.setItem(k, JSON.stringify(cache[k]));
    }
    v.innerHTML = `<h1>${B[bk][0]}</h1><div class="ch-info">第 ${ch} 章</div><hr style="border:0;border-top:1px solid var(--border);margin:20px 0">` + 
        (cache[k][ch]||[]).map((t,i)=>`<div class="line"><span class="num">${i+1}</span><span>${t}</span></div>`).join('');
    window.scrollTo(0,0);
}
const nav = d => {
    let n = ch + d;
    if (n < 1) bk > 0 ? go(bk-1, B[bk-1][2]) : 0;
    else if (n > B[bk][2]) bk < 65 ? go(bk+1, 1) : 0;
    else go(bk, n);
}
go(bk, ch);
</script>
</body>
</html>
